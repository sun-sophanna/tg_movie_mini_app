# Serves Local Bot API cached files for --local mode (HTTP /file/bot on the API server returns 404).
# Maps /file/bot<token>/<path> -> /var/lib/telegram-bot-api/<token>/<path>
server {
  listen 8082;
  server_name _;

  location ~ ^/file/bot([^/]+)/(.+)$ {
    alias /var/lib/telegram-bot-api/$1/$2;
  }
}
