# Optional Local Bot API (large files): create .env with TELEGRAM_API_ID + TELEGRAM_API_HASH from https://my.telegram.org
# then: docker compose -f docker-compose.dev.yml --profile telegram-api up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram-movie-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_movie
    volumes:
      - telegram_movie_pg:/var/lib/postgresql/data

  telegram-bot-api:
    profiles: ['telegram-api']
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-movie-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env for Local Bot API}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env for Local Bot API}
      TELEGRAM_LOCAL: '1'
    ports:
      - '8081:8081'
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

volumes:
  telegram_movie_pg:
  telegram_bot_api_data:
